[project]
name = "tele-cogni-play"
version = "0.1.0"
description = "Telegram bot for personal cognitive training with adaptive difficulty, AI-powered role-playing scenarios, and detailed progress analytics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot",
    "python-dotenv",
    "pydantic",
    "pydantic-settings",
    "structlog",
    "sqlalchemy",
    "alembic",
    "httpx",
    "python-dateutil",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "freezegun",
]
